name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      revision:
        description: Optional full commit SHA for a deployment image; does not replace the release image
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/invisi-labs/invisi-explorer
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  SOURCE_REVISION: ${{ inputs.revision }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version tag such as v1.2.0" >&2
            exit 1
          fi
          image_tag="${RELEASE_TAG#v}"
          if [[ -n "$SOURCE_REVISION" ]]; then
            if [[ ! "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Deployment revision must be a full commit SHA" >&2
              exit 1
            fi
            image_tag="${image_tag}-sha.${SOURCE_REVISION:0:12}"
          fi
          echo "value=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || format('refs/tags/{0}', env.RELEASE_TAG) }}
          path: source
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: Test tagged source
        working-directory: source
        run: |
          go test -race -timeout 30m ./... -count=1
          go vet ./...
          cd web
          npm ci
          npm test
          npm run build

      - name: Build release binaries
        if: ${{ !inputs.revision }}
        working-directory: source
        run: ./scripts/build-release.sh "$RELEASE_TAG" ../release-assets

      - name: Smoke test release archives
        if: ${{ !inputs.revision }}
        working-directory: source
        run: python3 scripts/smoke-archives.py "$RELEASE_TAG" ../release-assets

      - name: Set up target architecture emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.title=Invisi Explorer
            org.opencontainers.image.description=Independent public protocol explorer
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min

      - name: Smoke test published image
        working-directory: source
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: ./scripts/smoke-image.sh "$IMAGE@$DIGEST"

      - name: Publish GitHub Release assets
        if: ${{ !inputs.revision }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python3 source/scripts/release-notes.py "$RELEASE_TAG" > release-notes.md
          printf '\n## Artifacts\n\nImage: %s:%s\n\nDigest: %s\n\nSource: %s\n\nPlatforms: linux/amd64, linux/arm64.\n' "$IMAGE" "${RELEASE_TAG#v}" "$DIGEST" "$SOURCE_COMMIT" >> release-notes.md
          printf '\nCLI assets: Linux/macOS amd64 and arm64 archives with built web/dist frontend, documentation and SHA256SUMS-%s.txt. Run from the extracted directory or configure an absolute web-dir.\n' "$RELEASE_TAG" >> release-notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --draft
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md --draft=false --latest
          echo "Uploaded four supported platform archives and SHA-256 checksums to the GitHub Release." >> "$GITHUB_STEP_SUMMARY"
